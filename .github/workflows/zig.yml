name: Zig

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/zig.yml"
      - "codes/zig/**/*.zig"
      - "codes/zig/build.zig"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/zig.yml"
      - "codes/zig/**/*.zig"
      - "codes/zig/build.zig"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        # Keep the macOS SDK compatible with Zig 0.14.1.
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.14.1"

      - name: Build
        working-directory: codes/zig
        run: zig build

      - name: Test
        working-directory: codes/zig
        run: zig build test
