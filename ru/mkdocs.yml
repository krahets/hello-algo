# Config inheritance
INHERIT: ../mkdocs.yml

# Project information
site_name: Привет, алгоритмы!
site_url: https://www.hello-algo.com/ru/
site_description: Учебник по структурам данных и алгоритмам с анимированными схемами и примерами кода, которые можно запустить одним щелчком.
# Repository
edit_uri: tree/main/ru/docs
version: 1.3.0

# Configuration
theme:
  language: ru
  font:
    text: PT Sans
  palette:
    - scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/theme-light-dark
        name: Темная тема
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/theme-light-dark
        name: Светлая тема

extra:
  status:
    new: Недавно добавлено

# Page tree
